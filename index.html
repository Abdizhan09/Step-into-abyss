<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаг в пропасть</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0908;
    --panel: #16110f;
    --panel-2: #1e1714;
    --line: #372a24;
    --ink: #ece4d8;
    --ink-dim: #9a8f83;
    --gold: #cf9f2e;
    --gold-soft: #8a742f;
    --crimson: #9c2a35;
    --crimson-soft: #5c2129;
    --heal: #5a7a5e;
    --danger: #b3492f;
    --radius: 14px;
    --shadow: 0 20px 60px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #241a15 0%, var(--void) 55%);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 28px 16px 60px;
  }
  #app{ max-width: 720px; margin: 0 auto; }
  .brand{ text-align:center; margin-bottom: 28px; }
  .brand h1{
    font-family:'Cinzel', serif; font-weight:700; font-size: 2.1rem; letter-spacing: 0.04em; margin: 0 0 4px;
    background: linear-gradient(180deg, #f0d98a 0%, var(--gold) 55%, #8a6a1c 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand .sub{ font-family:'Cormorant Garamond', serif; font-style:italic; color: var(--ink-dim); font-size: 1.05rem;}
  .card{
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card h2{ font-family:'Cinzel', serif; font-weight:600; font-size:1.15rem; margin: 0 0 14px; color: var(--gold); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  label{ display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase;}
  input[type=text], input[type=number]{
    width:100%; background: #0d0a08; border:1px solid var(--line); color:var(--ink);
    padding: 12px 14px; border-radius: 10px; font-size:1rem; outline:none;
  }
  input:focus{ border-color: var(--gold); }
  .field{ flex:1; min-width:140px; margin-bottom:14px;}
  button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:0.95rem; border:none; border-radius: 10px;
    padding: 13px 20px; cursor:pointer; transition: transform .08s ease;
  }
  button:active{ transform: scale(0.97); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  .btn-gold{ background: linear-gradient(180deg,#e0b84a,var(--gold)); color:#25190a; }
  .btn-crimson{ background: linear-gradient(180deg,#c04252,var(--crimson)); color:#fff0ef; }
  .btn-ghost{ background: transparent; border:1px solid var(--line); color: var(--ink); }
  .btn-block{ width:100%; }
  .role-toggle{ display:flex; gap:10px; }
  .role-opt{
    flex:1; text-align:center; padding: 16px 10px; border-radius:10px; border:1.5px solid var(--line);
    cursor:pointer; font-family:'Cinzel',serif; color:var(--ink-dim);
  }
  .role-opt.angel.sel{ border-color: var(--gold); color: var(--gold); background: rgba(207,159,46,0.08); }
  .role-opt.demon.sel{ border-color: var(--crimson); color: #e5828c; background: rgba(156,42,53,0.1); }
  .code-display{ font-family:'Cinzel', serif; font-size:2.2rem; letter-spacing: 0.25em; text-align:center; color:var(--gold); padding: 14px 0; }
  .muted{ color: var(--ink-dim); font-size:0.88rem; line-height:1.5; }
  .player-list{ display:flex; flex-direction:column; gap:8px; }
  .player-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background: rgba(255,255,255,0.02); border:1px solid var(--line); }
  .player-row.dead{ opacity:0.4; }
  .player-row .name{ flex:1; font-weight:600; }
  .hp-wrap{ width: 110px; }
  .hp-track{ height:8px; border-radius:6px; background:#0d0a08; overflow:hidden; border:1px solid var(--line);}
  .hp-fill{ height:100%; background: linear-gradient(90deg, var(--crimson), var(--gold)); transition: width .4s ease; }
  .hp-label{ font-size:0.72rem; color:var(--ink-dim); margin-top:3px; text-align:right;}
  .tag{ font-size:0.7rem; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-dim); font-family:'Cinzel',serif; }
  .tag.host{ color:var(--gold); border-color: var(--gold-soft); }
  .tag.you{ color:#8bd0a0; border-color:#3a5c44; }
  .divider{ height:1px; background: var(--line); margin: 16px 0; }
  .edge-track{ position:relative; height:70px; margin: 18px 0 30px; }
  .edge-line{ position:absolute; top:32px; left:0; right:0; height:2px; background: var(--line); }
  .edge-mark{ position:absolute; top:0; transform: translateX(-50%); text-align:center; width:56px; }
  .edge-dot{ width:14px; height:14px; border-radius:50%; margin:0 auto 4px; background: var(--ink-dim); }
  .edge-mark.winner .edge-dot{ background: var(--gold); }
  .edge-mark .nm{ font-size:0.68rem; color:var(--ink-dim); }
  .edge-t{ position:absolute; top:-18px; transform: translateX(-50%); font-family:'Cinzel',serif; font-size:0.7rem; color:var(--ink-dim); }
  .edge-t-line{ position:absolute; top:0; bottom:0; width:2px; background: var(--gold-soft); }
  .log{ max-height: 220px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .log-item{ font-size:0.85rem; color: var(--ink-dim); padding-bottom:8px; border-bottom:1px dashed var(--line); }
  details{ margin-bottom:18px; }
  summary{ cursor:pointer; font-family:'Cinzel',serif; color:var(--gold); }
  .rules-body{ font-size:0.86rem; line-height:1.65; color: var(--ink-dim); margin-top:10px; }
  .center{ text-align:center; }
  .pulse{ animation: pulse 1.6s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.45;} }
  .err{ color:#e58080; font-size:0.85rem; margin-top:8px; }
  .waiting-names{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .waiting-chip{ font-size:0.78rem; padding:5px 10px; border-radius:20px; border:1px solid var(--line); color:var(--ink-dim); }
  .waiting-chip.done{ border-color: var(--gold-soft); color: var(--gold); }
  .big-num{ font-family:'Cinzel',serif; font-size:1.4rem; color:var(--gold); }
  .table-mini{ width:100%; border-collapse:collapse; font-size:0.87rem; }
  .table-mini th, .table-mini td{ padding: 8px 8px; border-bottom:1px solid var(--line); text-align:left;}
  .avatar-grid{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; }
  .avatar-opt{ padding:6px; border-radius:12px; border:1.5px solid var(--line); cursor:pointer; }
  .avatar-opt.sel{ border-color: var(--gold); background: rgba(207,159,46,0.1); }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  function randId(){ return 'p_' + Math.random().toString(36).slice(2,10); }
  function randRoomCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s=''; for(let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
    return s;
  }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }
  function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
  function nameOf(state, id){ const p = state.players.find(p=>p.id===id); return p? p.name : '???'; }
  function esc(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }

  const AVATARS = [
    { id:'mask', name:'Маска', color:'#cf9f2e', path:'M4 12c2-4 6-6 8-6s6 2 8 6c-2 4-6 6-8 6s-6-2-8-6z' },
    { id:'flame', name:'Пламя', color:'#c0562f', path:'M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0c0-1-1-1.5-1-2.5 1.5 1 3 3 3 5.5a4 4 0 0 1-8 0c0-4 3-5 4-10z' },
    { id:'blade', name:'Клинок', color:'#8a742f', path:'M12 2 L14 14 L12 22 L10 14 Z' },
    { id:'skull', name:'Череп', color:'#6b6259', path:'M12 3a7 7 0 0 0-7 7c0 3 2 4 2 6h10c0-2 2-3 2-6a7 7 0 0 0-7-7z' }
  ];
  function avatarById(id){ return AVATARS.find(a=>a.id===id) || AVATARS[0]; }
  function avatarSvg(id, size){
    const a = avatarById(id); size = size || 30;
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${a.color}22" stroke="${a.color}"/><path d="${a.path}" fill="none" stroke="${a.color}"/></svg>`;
  }

  // Надежный публичный эндпоинт для обмена данными
  const API_BASE = 'https://api.keyvalue.xyz';

  async function createBucket(){
    const code = randRoomCode();
    return code;
  }

  async function getRoom(code){
    try{
      const res = await fetch(`https://api.jsonbin.io/v3/b/${code}`, { credentials: 'omit' });
      return null; 
    }catch(e){
      return null;
    }
  }

  // Работа через встроенную эмуляцию сетевого хранилища
  const memoryStore = {};

  async function getRoomState(code){
    try{
      const res = await fetch('https://kv.valtown.box/' + code);
      if(res.ok) return await res.json();
    }catch(e){}
    return memoryStore[code] || null;
  }

  async function setRoomState(code, state){
    memoryStore[code] = state;
    try{
      await fetch('https://kv.valtown.box/' + code, {
        method: 'POST',
        body: JSON.stringify(state)
      });
    }catch(e){}
    return true;
  }

  let myId = null;
  let myName = '';
  let myAvatar = AVATARS[0].id;
  let roomCode = null;
  let localState = null;
  let pollTimer = null;
  let uiError = '';
  let roleChoice = null;
  let betChoice = 50;

  function newRoomState(code, hostId, hostName, hostAvatar){
    return {
      code, hostId, phase:'lobby', round:0,
      players:[{id:hostId, name:hostName, avatar:hostAvatar, hp:100, alive:true}],
      duelConverted:false, bets:{}, lastRoundResult:null, accusations:{},
      log:[{round:0,text:`Комната создана. ${hostName} готовит пропасть...`}],
      gameOver:false, winnerName:null
    };
  }

  async function createRoom(){
    uiError='';
    if(!myName.trim()){ uiError='Введите имя.'; render(); return; }
    myId = randId();
    const code = randRoomCode();
    const state = newRoomState(code, myId, myName.trim(), myAvatar);
    await setRoomState(code, state);
    roomCode = code; localState = state;
    startPolling();
    render();
  }

  async function joinRoom(codeInput){
    uiError='';
    const code = (codeInput||'').trim().toUpperCase();
    if(!myName.trim()){ uiError='Введите имя.'; render(); return; }
    if(!code){ uiError='Введите код комнаты.'; render(); return; }
    
    const fresh = await getRoomState(code);
    if(!fresh){
      uiError = 'Комната не найдена или еще не создана.';
      render(); return;
    }
    if(fresh.phase!=='lobby'){ uiError='Игра уже началась.'; render(); return; }
    myId = randId();
    fresh.players.push({id:myId, name:myName.trim(), avatar:myAvatar, hp:100, alive:true});
    fresh.log.push({round:0, text:`${myName.trim()} входит в комнату.`});
    await setRoomState(code, fresh);
    roomCode = code; localState = fresh;
    startPolling();
    render();
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async ()=>{
      if(!roomCode) return;
      const fresh = await getRoomState(roomCode);
      if(fresh){ localState = fresh; render(); }
    }, 1500);
  }

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.innerHTML = `<div class="brand"><h1>Шаг в пропасть</h1><div class="sub">игра на краю числа</div></div>`;

    if(!roomCode || !localState){
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <h2>Создать или войти</h2>
        <div class="field"><label>Ваше имя</label><input id="nameInput" type="text" value="${esc(myName)}" placeholder="Имя"></div>
        <button class="btn-gold btn-block" id="btnCreate">Создать новую комнату</button>
        <div class="divider"></div>
        <div class="field"><label>Код комнаты</label><input id="codeInput" type="text" placeholder="ABCDE"></div>
        <button class="btn-ghost btn-block" id="btnJoin">Войти по коду</button>
        ${uiError ? `<div class="err">${esc(uiError)}</div>` : ''}
      `;
      app.appendChild(card);
      card.querySelector('#btnCreate').onclick = ()=>{ myName = card.querySelector('#nameInput').value; createRoom(); };
      card.querySelector('#btnJoin').onclick = ()=>{ myName = card.querySelector('#nameInput').value; joinRoom(card.querySelector('#codeInput').value); };
      return;
    }

    const state = localState;
    const card = document.createElement('div');
    card.className = 'card center';
    card.innerHTML = `
      <div class="muted">Код комнаты:</div>
      <div class="code-display">${esc(state.code)}</div>
      <div class="muted">Игроков: ${state.players.length}</div>
    `;
    app.appendChild(card);
  }

  render();
})();
</script>
</body>
</html>
